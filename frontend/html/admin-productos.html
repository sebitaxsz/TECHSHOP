<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Productos</title>
    <link rel="stylesheet" href="/frontend/css/admin.css">
</head>
<body>
    <!------------------------------- NAVBAR -------------------------->
    <div class="navbar">
        <a href="/frontend/inicio.html"><button class="botonCasa">TechShop</button></a>
        <a href="/frontend/html/admin-productos.html"><button class="panelButton">Panel Admin</button></a>
        <a href="/frontend/html/productos.html"><button class="productosButton">Productos</button></a>
        <a href="/frontend/html/carrito.html"><button class="carritoButton">Carrito</button></a>
        <a href="/frontend/html/iniciarSesion.html"><button class="iniciarButton">Iniciar Sesion</button></a>    
    </div>        
    <!----------------------------------------------------------------->
<div class="admin-layout">

        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="admin-sidebar">
            <ul class="sidebar-menu">
                <li><a href="/frontend/html/admin-productos.html" class="sidebar-link active">📦 Productos</a></li>
                <li><a href="/frontend/html/admin-usuarios.html" class="sidebar-link">👥 Usuarios</a></li>
            </ul>
        </aside>

        <!-- CONTENIDO PRINCIPAL (CRUD DE PRODUCTOS) -->
        <main class="admin-content">
            
            <!-- Cabecera de la Sección -->
            <div class="content-header">
                <div>
                    <h1>Gestión de Productos</h1>
                    <p class="subtitulo-conteo">Mostrando registros de la base de datos</p>
                </div>
                <!-- Botón que activa el menú modal -->
                <button class="btn-primary" id="btnAbrirModal">+ Agregar Producto</button>
            </div>

            <!-- Tabla de Datos (Estructura CRUD adaptada a la Base de Datos) -->
            <div class="table-container">
                <table class="crud-table">
                    <thead>
                        <tr>
                            <th>IMAGEN</th>
                            <th>NOMBRE</th>
                            <th>DESCRIPCIÓN</th>
                            <th>PRECIO</th>
                            <th>STOCK</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="productos-tabla-cuerpo">
                        <!-- Fila de Ejemplo basada en tus campos -->
                        <tr>
                            <td><img src="https://via.placeholder.com/50" alt="Producto" class="table-img"></td>
                            <td class="item-title">ProBook X15 Laptop</td>
                            <td><span class="item-desc">Intel Core i7, 16GB RAM, 512GB SSD</span></td>
                            <td class="item-price">$1,299</td>
                            <td><span class="stock-indicator">🟢 45 u.</span></td>
                            <td>
                                <button class="btn-edit">✏️ Editar</button>
                            </td>
                        </tr>
                        <!-- Aquí se inyectarán los datos desde tu API -->
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <div class="pagination">
                <span>Página 1 de 1</span>
                <div class="pagination-controls">
                    <span class="disabled">Anterior</span>
                    <span class="disabled">Siguiente</span>
                </div>
            </div>

        </main>
</div>

    <!----------------- MENÚ MODAL PARA CREAR PRODUCTO --------------------->
    <div id="modalProducto" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <h2 style="margin-bottom: 20px; font-size: 1.25rem;">Nuevo Producto</h2>
            
            <form id="formCrearProducto" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Nombre</label>
                    <input type="text" id="nombreProd" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Descripción</label>
                    <textarea id="descProd" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; resize: none; height: 60px;"></textarea>
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Precio</label>
                    <input type="number" id="precioProd" step="0.01" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Stock</label>
                    <input type="number" id="stockProd" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">URL de la Imagen</label>
                    <input type="text" id="imagenProd" placeholder="https://..." required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Guardar</button>
                    <button type="button" id="btnCerrarModal" style="flex: 1; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 8px;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    <!----------------------------------------------------------------------->

    <!-- Script para controlar la apertura y cierre del menú modal -->
    <script>
        const modal = document.getElementById('modalProducto');
        const btnAbrir = document.getElementById('btnAbrirModal');
        const btnCerrar = document.getElementById('btnCerrarModal');

        btnAbrir.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        btnCerrar.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
