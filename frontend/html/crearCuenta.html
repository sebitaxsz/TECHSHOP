<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="/frontend/css/crearCuenta.css">
</head>
<body>
    <!------------------------- INICIO --------------------->
    <a href="/frontend/inicio.html"><button class="botonInicio">Volver a la web</button></a>
    <!------------------------------------------------------>


    <!--------------------- FORMULARIO --------------------->
    <form id="registerForm">
    <!------------------------ TITULO ---------------------->
    <H1 class="titulo">Crear una Cuenta</H1>
    <!------------------------------------------------------>
        <input type="text" name="nombre" id="nombre" placeholder="Ingrese su nombre">
        <input type="text" name="apellido" id="apellido" placeholder="Ingrese su apellido">
        <input type="email" name="correo" id="correo" placeholder="Ingrese su correo">
        <input type="text" name="contraseña" id="contraseña" placeholder="Ingrese su contraseña">
        <input type="text" name="contraseña2" id="contraseña2" placeholder="Repita su contraseña">
        <p>Al continuar acepto que estoy de acuerdo con los <a href="https://phylo.co/blog/que-son-los-terminos-y-condiciones">Terminos y Condiciones</a></p>
        <div id="mensajeRegistro"></div>
        <button type="submit">Crear Cuenta</button>
        <p>¿Ya tienes cuenta? <a href="/frontend/html/iniciarSesion.html">Inicia Sesion</a></p>        
    </form>
    <!------------------------------------------------------>

    <script src="../js/register.js"></script>
</body>
</html>
