<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Usuarios</title>
    <link rel="stylesheet" href="/frontend/css/admin.css">
</head>
<body>
    <!------------------------------- NAVBAR -------------------------->
    <div class="navbar">
        <a href="/frontend/inicio.html"><button class="botonCasa">TechShop</button></a>
        <a href="/frontend/html/admin-productos.html"><button class="panelButton">Panel Admin</button></a>
        <a href="/frontend/html/productos.html"><button class="productosButton">Productos</button></a>
        <a href="/frontend/html/carrito.html"><button class="carritoButton">Carrito</button></a>
        <a href="/frontend/html/iniciarSesion.html"><button class="iniciarButton">Iniciar Sesion</button></a>    
    </div>        
    <!----------------------------------------------------------------->

    <!------------------------------ BODY ----------------------------->
    <div class="admin-layout">

        <!-- BARRA LATERAL (SIDEBAR) -->
        <aside class="admin-sidebar">
            <ul class="sidebar-menu">
                <li><a href="admin-productos.html" class="sidebar-link">📦 Productos</a></li>
                <li><a href="admin-usuarios.html" class="sidebar-link active">👥 Usuarios</a></li>
            </ul>
        </aside>

        <!-- CONTENIDO PRINCIPAL (CRUD DE USUARIOS) -->
        <main class="admin-content">
            
            <!-- Cabecera de la Sección -->
            <div class="content-header">
                <div>
                    <h1>Gestión de Usuarios</h1>
                    <p class="subtitulo-conteo">Mostrando registros de la base de datos</p>
                </div>
                <!-- Botón que activa el menú modal -->
                <button class="btn-primary" id="btnAbrirModalUsuario">+ Agregar Usuario</button>
            </div>

            <!-- Tabla de Datos de Usuarios -->
            <div class="table-container">
                <table class="crud-table">
                    <thead>
                        <tr>
                            <th>NOMBRE</th>
                            <th>APELLIDO</th>
                            <th>CORREO</th>
                            <th>CONTRASEÑA</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="usuarios-tabla-cuerpo">
                        <!-- Fila de ejemplo estática (plantilla visual) -->
                        <tr>
                            <td class="item-title">Carlos</td>
                            <td>Rodriguez</td>
                            <td>carlos@techshop.com</td>
                            <td><span class="badge-password">••••••••</span></td>
                            <td>
                                <button class="btn-edit">✏️ Editar</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <div class="pagination">
                <span>Página 1 de 1</span>
            </div>

        </main>
    </div>
    <!----------------------------------------------------------------->

    <!----------------- MENÚ MODAL PARA CREAR USUARIO --------------------->
    <div id="modalUsuario" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 12px; width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <h2 style="margin-bottom: 20px; font-size: 1.25rem;">Nuevo Usuario</h2>
            
            <form id="formCrearUsuario" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Nombre</label>
                    <input type="text" id="nombreUsuario" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Apellido</label>
                    <input type="text" id="apellidoUsuario" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Correo</label>
                    <input type="email" id="correoUsuario" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: 600;">Contraseña</label>
                    <input type="password" id="passwordUsuario" required style="width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;">
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button type="submit" class="btn-primary" style="flex: 1;">Guardar</button>
                    <button type="button" id="btnCerrarModalUsuario" style="flex: 1; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px; cursor: pointer; font-weight: 600; padding: 8px;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    <!----------------------------------------------------------------------->

    <!-- Script para controlar la apertura y cierre del menú modal de usuarios -->
    <script>
        const modalUsuario = document.getElementById('modalUsuario');
        const btnAbrirUsuario = document.getElementById('btnAbrirModalUsuario');
        const btnCerrarUsuario = document.getElementById('btnCerrarModalUsuario');

        btnAbrirUsuario.addEventListener('click', () => {
            modalUsuario.style.display = 'flex';
        });

        btnCerrarUsuario.addEventListener('click', () => {
            modalUsuario.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modalUsuario) {
                modalUsuario.style.display = 'none';
            }
        });
    </script>
</body>
</html>
